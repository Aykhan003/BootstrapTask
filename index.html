<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Clean Blog</title>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">

                <a class="navbar-brand fw-bold text-black" href="#">Start Bootstrap</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto py-4 py-lg-0 text-black">

                        <li class="nav-item">
                            <a class="nav-link active px-lg-3 py-3 py-lg-4 text-black" href="#">HOME</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link px-lg-3 py-3 py-lg-4 text-black" href="#">ABOUT</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link px-lg-3 py-3 py-lg-4 text-black" href="#">SAMPLE POST</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link px-lg-3 py-3 py-lg-4 text-black" href="#">CONTACT</a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <div class="masthead text-white text-center d-flex align-items-center"
        style="background-image: url('https://startbootstrap.github.io/startbootstrap-clean-blog/assets/img/home-bg.jpg'); background-size: cover; background-position: center; height: 550px;">

        <div class="container position-relative px-4 px-lg-5">

            <div class="row gx-4 gx-lg-5 justify-content-center">

                <div class="col-md-10 col-lg-8 col-xl-7">

                    <div class="site-heading">

                        <h1 class="display-1 fw-bold">Clean Blog</h1>

                        <span class="fs-4 fw-light">
                            A Blog Theme by Start Bootstrap
                        </span>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
