<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <header class="position-relative" style="height: 640px;
    background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://startbootstrap.github.io/startbootstrap-clean-blog/assets/img/home-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;">

        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container px-5">

                <a class="navbar-brand fw-bold fs-4" href="#">
                    Start Bootstrap
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">

                    <ul class="navbar-nav gap-3">
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold" href="#">HOME</a>

                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold" href="#">ABOUT</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold" href="#">SAMPLE POST</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold" href="#">CONTACT</a>
                        </li>
                    </ul>

            </div>
        </nav>

        <div class="position-absolute top-50 start-50 translate-middle w-100 text-center text-white">

            <h1 class="display-1 fw-bold">Clean Blog</h1>
